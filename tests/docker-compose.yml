services:
  mapas:
    environment:
      # Os testes exercitam o caminho completo sem sair da máquina. O modo de
      # desenvolvimento é o padrão do plugin, mas fica explícito aqui para que
      # nenhuma execução da suíte consiga falar com o BSC por acidente.
      - AVALIACAO_DEV_MODE=TRUE

      # O subsite de verdade é criado pelo TestCase e injetado na configuração
      # do plugin; estes valores existem só para a configuração nascer completa,
      # já que sem eles o plugin não registra nada.
      - AVALIACAO_BSC_URL=http://bsc.invalido.teste/avaliacoes

      # Credenciais do gateway, emprestadas do RCV. Existem para a configuração
      # nascer completa — os testes que exercitam o modo real só chegam até o
      # registro, nunca ao envio, então nenhuma requisição é tentada.
      - RCV_BSC_AUTH_TOKEN=http://bsc.invalido.teste/sca/oauth/token
      - RCV_BSC_CLIENT_ID=teste
      - RCV_BSC_CLIENT_SECRET=teste
      - AVALIACAO_ORGAO=36802
      - AVALIACAO_SUBSITE_ID=1
      - AVALIACAO_SERVICO_CADASTRO=13687
      - AVALIACAO_SERVICO_COLETIVO=13682
      - AVALIACAO_SERVICO_OPORTUNIDADE=13685
      - AVALIACAO_SERVICO_EVENTO=13684
      - AVALIACAO_SERVICO_ESPACO=13683
      - AVALIACAO_SERVICO_PROJETO=13686

    volumes:
      # O plugin em si. O bind resolve o caminho no host, então funciona tanto
      # com o diretório de verdade quanto com um link simbólico apontando para
      # fora do repositório do core — um link sozinho não bastaria, porque
      # dentro do container ele apontaria para um caminho que não existe.
      - ../src/plugins/GovBrSatisfaction:/var/www/src/plugins/GovBrSatisfaction

      # Ativa o plugin sem editar tests/config.d/ do core. O prefixo "zz-" faz o
      # diretório ordenar depois de "config.d" no glob de src/conf/config.php,
      # então a chave 'plugins' declarada aqui substitui a do repositório.
      # Caminhos relativos ao cwd esperado do `docker compose`: tests/ do
      # repositório principal — ver README.md do plugin.
      - ../src/plugins/GovBrSatisfaction/tests/config.d:/var/www/config/zz-govbr-satisfaction.d

      # Testes do plugin como subpasta de /var/www/tests, o mesmo destino de
      # tests/src do core. O autoload PSR-4 'Tests\' => '/var/www/tests' resolve
      # "Tests\GovBrSatisfaction\TriggerTest" para
      # /var/www/tests/GovBrSatisfaction/TriggerTest.php, então as classes daqui
      # estendem Tests\Abstract\TestCase normalmente.
      - ../src/plugins/GovBrSatisfaction/tests/src:/var/www/tests/GovBrSatisfaction

  # O dump do repositório principal cria a extensão postgis_tiger_geocoder, que
  # a imagem declarada lá não tem: o banco morre no boot e a suíte fica
  # pendurada. Trocar a imagem aqui resolve sem editar nada do core — ver
  # tests/db/Dockerfile.
  db:
    image: !reset null
    build:
      context: ../src/plugins/GovBrSatisfaction/tests/db
